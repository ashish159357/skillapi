server.port=8081

# Configuration for Postgres database
#spring.datasource.url=jdbc:mysql://mysqldb/quizappdb
spring.datasource.url=jdbc:postgresql://localhost:5432/quizappdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.hikari.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Configuration for Swagger Spring Doc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs


#liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog.xml
spring.profiles.active=@activatedProperties@

