spring.application.name=skillapi
server.port=8081

# Configuration for Postgres database
#spring.datasource.url=jdbc:mysql://mysqldb/quizappdb
spring.datasource.url=jdbc:postgresql://localhost:5432/quizappdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.hikari.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Configuration for Swagger Spring Doc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs

# liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog.xml
spring.profiles.active=@activatedProperties@

# eureka - default configuration for local development
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


